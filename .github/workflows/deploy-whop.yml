name: Deploy to Whop Websites

on:
  workflow_dispatch:
    inputs:
      domain_slug:
        description: "Whop subdomain slug (e.g. ridgeline-roofing -> ridgeline-roofing.whop.site)"
        required: true
        default: "ridgeline-roofing"
        type: string
      app_name:
        description: "Whop Website display name"
        required: true
        default: "RidgeLine Roofing"
        type: string
      app_id:
        description: "Optional existing Whop App ID (app_xxx) — leave blank to create or auto-match"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Provision Plans & Deploy to Whop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build & run compliance tests
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Provision plans & deploy live to Whop Websites
        env:
          APP_NAME: ${{ inputs.app_name }}
          DOMAIN_SLUG: ${{ inputs.domain_slug }}
          WHOP_APP_ID: ${{ inputs.app_id }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_ACCOUNT_ID: ${{ secrets.WHOP_ACCOUNT_ID }}
          WHOP_SANDBOX_API_KEY: ${{ secrets.WHOP_SANDBOX_API_KEY }}
          WHOP_SANDBOX_ACCOUNT_ID: ${{ secrets.WHOP_SANDBOX_ACCOUNT_ID }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          WHOP_ADMIN_KEY: ${{ secrets.WHOP_ADMIN_KEY }}
        run: node scripts/ci-deploy.mjs
